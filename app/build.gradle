plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.absolute.todocentral'
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "com.absolute.todocentral"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    // Signing credentials come from keystore.properties (git-ignored) or, for
    // CI, the matching environment variables. Nothing secret lives in this
    // file: it is public, and the password used to sit here in plain text.
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file("keystore.properties")
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }

    def ksPath = keystoreProps["storeFile"] ?: System.getenv("TC_KEYSTORE_FILE")
    def ksStorePass = keystoreProps["storePassword"] ?: System.getenv("TC_KEYSTORE_PASSWORD")
    def ksAlias = keystoreProps["keyAlias"] ?: System.getenv("TC_KEY_ALIAS")
    def ksKeyPass = keystoreProps["keyPassword"] ?: System.getenv("TC_KEY_PASSWORD")
    def canSign = ksPath != null && file(ksPath).exists() && ksStorePass != null

    signingConfigs {
        release {
            if (canSign) {
                storeFile file(ksPath)
                storePassword ksStorePass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    lint {
        textReport true
        textOutput file("lint-report.txt")
        abortOnError true
    }

    buildTypes {
        release {
            signingConfig canSign ? signingConfigs.release : null
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError true
        disable 'MissingTranslation', 'ExtraTranslation', 'StringFormatInvalid', 'ValidFragment'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // UI
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.github.XunMengWinter:CircularAnim:0.3.4'
    implementation 'com.github.Daio-io:dresscode:1.0.0'
    implementation 'com.heinrichreimersoftware:material-intro:1.6'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.airbnb.android:lottie:6.7.1'

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    implementation 'androidx.room:room-rxjava2:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'

    // RxJava
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxkotlin:2.4.0'

    // Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.8.4'

    // Tests
    testImplementation 'junit:junit:4.13.2'
}
